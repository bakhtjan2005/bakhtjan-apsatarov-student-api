server.port=8080
spring.application.name=bakhtjan-apsatarov-student-api

# Параметры БД берутся из переменных окружения (в Docker — имя сервиса "db", а не localhost)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.student-name=Bakhtjan Apsatarov
app.version=${APP_VERSION:1.0.0}
